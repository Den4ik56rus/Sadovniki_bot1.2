upstream bot_api {
    server bot:8080;
}

# HTTP → HTTPS редирект
server {
    listen 80;
    server_name proagro56.ru www.proagro56.ru;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name proagro56.ru www.proagro56.ru;

    ssl_certificate /etc/letsencrypt/live/proagro56.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proagro56.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Статика admin-webapp
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Webhooks — БЕЗ авторизации (YooKassa и т.д.)
    location /api/webhooks/ {
        proxy_pass http://bot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE endpoints — отключить буферизацию
    location /api/admin/events/ {
        auth_basic "Admin Panel";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://bot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin API — с авторизацией
    location /api/admin/ {
        auth_basic "Admin Panel";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://bot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        client_max_body_size 50M;
    }

    # Остальные API (webapp и т.д.) — без авторизации
    location /api/ {
        proxy_pass http://bot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        client_max_body_size 50M;
    }

    # SPA fallback — с авторизацией (сама админка)
    location / {
        auth_basic "Admin Panel";
        auth_basic_user_file /etc/nginx/.htpasswd;

        try_files $uri $uri/ /index.html;
    }
}
